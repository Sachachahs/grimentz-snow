# Compile l'application mobile sur les serveurs de GitHub (aucune installation sur le PC nécessaire).
# Résultat : une « Release » nommée « latest » contenant les APK à installer sur le téléphone Android.
name: Application (APK Android)

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Compiler aussi la version iOS (vérification, non signée)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/data.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les dossiers natifs Android / iOS
        run: |
          flutter create --org ch.grimentzsnow --project-name grimentz_snow --platforms=android,ios .
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 tool/setup_platforms.py

      - run: flutter pub get

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: APK debug
        run: flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=DATA_URL=$DATA_URL --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: APK release
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=DATA_URL=$DATA_URL --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Renommer les APK
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/GrimentzSnow.apk
          cp build/app/outputs/flutter-apk/app-debug.apk ../dist/GrimentzSnow-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GrimentzSnow-apk
          path: dist/*.apk

      - name: Publier la Release « latest »
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/GrimentzSnow.apk dist/GrimentzSnow-debug.apk \
            --title "Grimentz Snow – version 1.0.${{ github.run_number }}" \
            --notes "Installer **GrimentzSnow.apk** sur le téléphone Android (autoriser l'installation depuis cette source si Android le demande). GrimentzSnow-debug.apk : version de diagnostic. Données : $DATA_URL" \
            --target ${{ github.sha }}

  # Simulateur : la même application compilée pour le navigateur, publiée sur GitHub Pages
  # (https://<compte>.github.io/<dépôt>/simulator.html).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}simulator.html
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le dossier web
        run: flutter create --org ch.grimentzsnow --project-name grimentz_snow --platforms=web .
      - run: flutter pub get
      - name: Compilation web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=DATA_URL=https://raw.githubusercontent.com/${{ github.repository }}/data/data.json --dart-define=APP_VERSION=1.0.${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter create --org ch.grimentzsnow --project-name grimentz_snow --platforms=android,ios .
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 tool/setup_platforms.py
          flutter pub get
      - name: Compilation iOS (sans signature)
        run: flutter build ios --release --no-codesign --dart-define=DATA_URL=https://raw.githubusercontent.com/${{ github.repository }}/data/data.json
      - run: cd build/ios/iphoneos && zip -qr ../../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: GrimentzSnow-ios-unsigned
          path: Runner-unsigned.zip
