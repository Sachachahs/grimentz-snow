# Backend de l'application : collecte les données toutes les 15 minutes et les publie
# sur la branche « data » (lue par l'application à l'adresse raw.githubusercontent.com/<compte>/<dépôt>/data/data.json).
# Tourne sur les serveurs de GitHub : le PC de l'utilisateur n'est jamais utilisé.
name: Données (backend)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/data.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Zurich
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Reprendre la dernière publication (historique, données précédentes)
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data:refs/remotes/origin/data 2>/dev/null; then
            git archive origin/data | tar -x -C out
          fi
          ls -la out

      - name: Cache des runs MétéoSuisse déjà lus
        uses: actions/cache@v4
        with:
          path: backend/.cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Collecter les données
        run: python backend/build_data.py --out out --cache backend/.cache

      - name: Publier sur la branche data
        run: |
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name "grimentz-snow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Données du $(date '+%d.%m.%Y %H:%M')"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      # GitHub désactive les tâches planifiées d'un dépôt public après 60 jours sans activité :
      # on les maintient actives (appel sans effet si elles le sont déjà).
      - name: Garder la collecte active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data.yml/enable" || true
